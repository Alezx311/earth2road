[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terra-drive"
version = "0.1.0b1"
description = "Reproducible OSM world packages with Godot and BeamNG adapters"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "TerraDrive contributors"}]
dependencies = []

[project.optional-dependencies]
generator = ["eclipse-sumo==1.27.1", "sumolib==1.27.1", "numpy>=2.2,<3", "pyproj==3.7.2", "shapely==2.1.2", "Pillow==12.3.0", "osmium==4.3.1", "requests>=2.32,<3"]
traffic = ["libsumo==1.27.1", "traci==1.27.1", "websockets==15.0.1"]

[project.scripts]
terra-drive = "akadem_maps.cli:main"
akadem-maps = "akadem_maps.cli:main"

[tool.setuptools.packages.find]
include = ["akadem_maps*"]

[tool.setuptools.package-data]
akadem_maps = ["resources/*.json", "resources/*.xml"]
